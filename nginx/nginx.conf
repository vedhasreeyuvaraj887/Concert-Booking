events { worker_connections 4096; }
http {
  resolver 127.0.0.11 valid=5s;            # Docker DNS: re-resolve so --scale app=N replicas are balanced
  # limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;   # enable to throttle abusive clients
  server {
    listen 80;
    location / {
      # limit_req zone=per_ip burst=40 nodelay;
      set $upstream http://app:8000;
      proxy_pass $upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
